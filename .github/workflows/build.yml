name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/Jellyfin.Plugin.ElArcaWrapped.Tests/Jellyfin.Plugin.ElArcaWrapped.Tests.csproj

      - name: Build plugin
        run: dotnet build src/Jellyfin.Plugin.ElArcaWrapped/Jellyfin.Plugin.ElArcaWrapped.csproj --configuration Release --no-restore

      - name: Upload raw build output for dependency inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: el-arca-wrapped-raw-build-output
          path: src/Jellyfin.Plugin.ElArcaWrapped/bin/Release/net10.0/
          retention-days: 7

      - name: Run tests
        run: dotnet test tests/Jellyfin.Plugin.ElArcaWrapped.Tests/Jellyfin.Plugin.ElArcaWrapped.Tests.csproj --configuration Release --no-restore

      - name: Package validation build
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d
        id: jprm
        with:
          path: ./src/Jellyfin.Plugin.ElArcaWrapped
          dotnet-target: net10.0

      - name: Upload validation package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: el-arca-wrapped-validation-package
          path: ${{ steps.jprm.outputs.artifact }}
          retention-days: 14
          if-no-files-found: error
