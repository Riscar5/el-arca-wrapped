name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Jellyfin.Plugin.ElArcaWrapped/Jellyfin.Plugin.ElArcaWrapped.csproj

      - name: Build
        run: dotnet build src/Jellyfin.Plugin.ElArcaWrapped/Jellyfin.Plugin.ElArcaWrapped.csproj --configuration Release --no-restore
